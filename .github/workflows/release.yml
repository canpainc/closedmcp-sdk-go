name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without publishing"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go mod download
      - name: Module release
        run: echo "Go modules are released by the Git tag; no registry upload is required."
